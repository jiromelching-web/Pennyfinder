name: refresh
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch: {}       # lets the app's Refresh button (or the Actions tab) run it now
permissions:
  contents: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install beautifulsoup4
      - run: python scripts/refresh.py --out docs/data/deals.json
      - name: Commit new data
        run: |
          git config user.name "pennyfinder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/deals.json
          git commit -m "data refresh $(date -u +%FT%TZ)" || echo "no changes"
          git push
